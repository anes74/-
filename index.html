<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع الدكتور لخضر بن حمدي | الدروس الإسلامية</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .font-arabic { font-family: 'Amiri', serif; }
    .bg-islamic-pattern {
      background-color: #042f2e;
      background-image: radial-gradient(#10b981 0.75px, transparent 0.75px), radial-gradient(#10b981 0.75px, #042f2e 0.75px);
      background-size: 30px 30px;
      background-position: 0 0,15px 15px;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col relative">

  <!-- Header -->
  <header class="bg-islamic-pattern text-white shadow-xl border-b-4 border-amber-500">
    <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        
        <!-- Profile Picture & Title Section -->
        <div class="flex items-center space-x-5 space-x-reverse">
          <div class="relative">
            <!-- إذا قمت برفع صورتك وسميتها profile.jpg، سيتم عرضها مباشرة -->
            <img src="profile.jpg" alt="صورة الدكتور لخضر بن حمدي" id="profile-img" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-4 border-amber-400 shadow-2xl" onerror="this.src='https://via.placeholder.com/150/042f2e/fbbf24?text=د.لخضر'">
          </div>
          <div>
            <div class="flex items-center space-x-2 space-x-reverse">
              <i class="fa-solid fa-kaaba text-2xl text-amber-400"></i>
              <h1 class="text-2xl sm:text-3xl font-bold tracking-tight gold-text">موقع الدكتور لخضر بن حمدي</h1>
            </div>
            <p class="text-amber-300 text-sm sm:text-base font-semibold mt-1 bg-emerald-950/60 px-3 py-1 rounded-lg inline-block border border-emerald-700/50">باحث في الشريعة الاسلامية</p>
            <div class="flex flex-wrap items-center gap-4 mt-2 text-xs text-emerald-200">
              <span class="flex items-center"><i class="fa-solid fa-phone text-amber-400 ml-1.5"></i> 0558756600</span>
              <span class="flex items-center"><i class="fa-solid fa-envelope text-amber-400 ml-1.5"></i> lakhdarlaz@hotmail.com</span>
            </div>
          </div>
        </div>
        
        <div class="text-center md:text-left">
          <p class="font-arabic text-2xl text-amber-300">رَبِّ زِدْنِي عِلْمًا</p>
          <p class="text-xs text-emerald-300 italic font-serif">"وَقُل رَّبِّ زِدْنِي عِلْمًا" [طه: 114]</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Bar -->
  <div class="bg-emerald-900 text-emerald-100 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-6 space-x-reverse text-sm font-medium">
        <span class="flex items-center"><i class="fa-solid fa-book-open text-amber-400 ml-2"></i> إجمالي الدروس: <strong id="total-lessons-count" class="mr-1 text-white">0</strong></span>
        <span class="flex items-center"><i class="fa-solid fa-layer-group text-amber-400 ml-2"></i> التصنيفات: <strong id="total-cats-count" class="mr-1 text-white">0</strong></span>
      </div>
      
      <div class="flex items-center space-x-3 space-x-reverse">
        <button onclick="openModal('lesson-modal')" class="gold-gradient hover:opacity-90 text-slate-900 font-bold px-4 py-2 rounded-lg shadow-lg flex items-center transition duration-200">
          <i class="fa-solid fa-circle-plus ml-2"></i> إضافة درس جديد
        </button>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full">
    
    <!-- Controls: Search & Category Pills -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-100">
      <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
        <div class="relative w-full md:w-96">
          <input type="text" id="search-input" onkeyup="filterLessons()" placeholder="بحث في الدروس، المحاضرين، الموضوعات..." 
                 class="w-full pr-10 pl-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring
